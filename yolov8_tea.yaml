# yolov8_tea.yaml
# Tea-YOLO: 针对微距茶叶病害的轻量化高精度模型
# 创新点: 颈部全 DWConv 轻量化 + ECA 注意力机制

nc: 3  # 您的类别数量: 炭疽病、茶饼病、健康
scales:
  m: [0.67, 0.75, 768] # 对齐 YOLOv8m 的体量

backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]   # 9
  - [-1, 1, ECA, []]           # 10 ✨ 创新点：深层特征金字塔前置 ECA 模块

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  
  - [-1, 3, C2f, [512]]        # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  
  - [-1, 3, C2f, [256]]        # 16

  - [-1, 1, DWConv, [256, 3, 2]] # 17 ✨ 创新点：用 DWConv 替代 Conv，极大幅度降低参数量
  - [[-1, 13], 1, Concat, [1]] 
  - [-1, 3, C2f, [512]]        # 19

  - [-1, 1, DWConv, [512, 3, 2]] # 20 ✨ 创新点：DWConv 下采样
  - [[-1, 10], 1, Concat, [1]] # 连接第 10 层的 ECA 特征
  - [-1, 3, C2f, [1024]]       # 22

  - [[16, 19, 22], 1, Detect, [nc]]  # Detect